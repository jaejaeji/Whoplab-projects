<!-- hint: grid-template-columns, grid-template-rows, grid-column / grid-row (span), "span" instead of "merge" -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BentoBox</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Marker+Hatch&family=Tilt+Neon&display=swap" rel="stylesheet">
    
</head>
<body>
    <header>Bento Box</header>
    <div class="box">
        <div class="grid-container">
            <div class="R">Rice</div>
            <div class="P">Protein</div>
            <div class="T">Tempura</div>
            <div class="V">Veggies</div>
            <div class="S">Sauce</div>
            <div class="M">Mochi</div>
        </div>
    </div>
</body>
</html>
