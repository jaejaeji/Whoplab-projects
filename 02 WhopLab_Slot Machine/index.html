<DOCTYPE! HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=0">
        <link rel="stylesheet" type="text/css" href="styles.css">

    </head>

    <body>
        <h1>Slot Machine 777</h1>

        <div class="heading">
            <img class="slots"
                src = "./casino_7.png"
                alt = "slot_1"
                width = "200"
            />
            <img class="slots"
                src = "./casino_7.png"
                alt = "slot_2"
                width = "200"
            /> 
            <img class="slots"
                src = "./casino_7.png"
                alt = "slot_3"
                width = "200"
            />

        </div>

        <div class="buttons">
            <button class="spin_once">Spin Once</button>
            <input type="text" placeholder="Spins" style="
            margin-left: 20px;
            margin-right: 20px;
            "/>
            <button class="simulate_spins">Simulate Spins</button>
        </div>

        <div class="end">
            <div class="win_status">Win Status</div>
            <div class="total">
                <div class="total_spins">Total Spins</br>#</div>
                <div class="total_wins">Total Wins</br>#</div>
                <div class="win_rate">Win Rate</br>n%</div>
            </div>
        </div>
    </body>
</html>
